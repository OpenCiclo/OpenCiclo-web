# Local stack and self-hosting. Every port is published on 127.0.0.1 only, so
# nothing here is reachable from other machines. To serve the app to others,
# put a reverse proxy with TLS in front of it (see Help "Run it yourself").
#
# The app needs two secrets that are not in this file or in the image. Create
# them once, next to this file (Compose reads .env; git ignores it):
#   printf 'SESSION_SECRET=%s\nEMAIL_LOOKUP_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
# Upgrading an install that already has accounts? Put the values this file used
# to set in .env instead (apps/web/README.md, "Self-host"): a new
# EMAIL_LOOKUP_SECRET breaks every existing email sign-in.
# `docker compose up -d db mailpit` (Postgres and Mailpit only) does not need them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openciclo
      POSTGRES_PASSWORD: openciclo
      POSTGRES_DB: openciclo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/web/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql
      - ./apps/web/drizzle/0001_pool_upsert.sql:/docker-entrypoint-initdb.d/0001_pool_upsert.sql
      - ./apps/web/drizzle/0002_learn_articles.sql:/docker-entrypoint-initdb.d/0002_learn_articles.sql
      - ./apps/web/drizzle/0003_mailbox_pending.sql:/docker-entrypoint-initdb.d/0003_mailbox_pending.sql
      - ./apps/web/drizzle/0004_account_activity.sql:/docker-entrypoint-initdb.d/0004_account_activity.sql
      - ./apps/web/drizzle/0005_vault_version.sql:/docker-entrypoint-initdb.d/0005_vault_version.sql
      - ./apps/web/drizzle/0006_rate_limit_hits.sql:/docker-entrypoint-initdb.d/0006_rate_limit_hits.sql
      - ./apps/web/drizzle/0007_lookup_indexes.sql:/docker-entrypoint-initdb.d/0007_lookup_indexes.sql
      - ./apps/web/drizzle/0008_friends.sql:/docker-entrypoint-initdb.d/0008_friends.sql
      - ./apps/web/drizzle/0009_feedback.sql:/docker-entrypoint-initdb.d/0009_feedback.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openciclo -d openciclo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    build:
      context: ./apps/web
    image: openciclo-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://openciclo:openciclo@db:5432/openciclo
      # From .env (see the top of this file). The container refuses to start without them.
      SESSION_SECRET: ${SESSION_SECRET:-}
      EMAIL_LOOKUP_SECRET: ${EMAIL_LOOKUP_SECRET:-}
      APP_URL: http://localhost:3000
      MAIL_FROM: Ciclo <noreply@localhost>
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
