# EAS Build, custom config (docs/ios.md, "Building in the cloud with EAS").
# Ciclo is a Capacitor app, not an Expo app: no prebuild, no CocoaPods. The job
# exports the web app for iOS, copies it into the Xcode project and compiles it
# for the simulator, unsigned. Its use is to check that the Swift code and the
# Xcode project build without a Mac; the .app only runs on a Mac's simulator.
#
# The real Xcode project is apps/mobile/ios/App/App.xcodeproj. The copy next to
# this file (apps/mobile/eas/ios/App.xcodeproj) is only there for the EAS CLI,
# which looks for ios/*.xcodeproj before it uploads anything. Nothing builds it.
build:
  name: Ciclo iOS (simulator, unsigned)
  steps:
    - eas/checkout

    - run:
        name: Install packages
        command: |
          set -e
          # The job may start in apps/mobile/eas or at the repository root: find the root.
          ROOT="$PWD"; while [ ! -f "$ROOT/agents.txt" ] && [ "$ROOT" != "/" ]; do ROOT="$(dirname "$ROOT")"; done
          echo "Job directory: $PWD; repository: $ROOT"
          cd "$ROOT/apps/web" && npm ci
          cd "$ROOT/apps/mobile" && npm ci

    - run:
        name: Export the web app and copy it into the Xcode project
        command: |
          set -e
          ROOT="$PWD"; while [ ! -f "$ROOT/agents.txt" ] && [ "$ROOT" != "/" ]; do ROOT="$(dirname "$ROOT")"; done
          cd "$ROOT/apps/mobile" && npm run build:ios

    - run:
        name: Build for the simulator
        command: |
          set -e
          JOB="$PWD"
          ROOT="$PWD"; while [ ! -f "$ROOT/agents.txt" ] && [ "$ROOT" != "/" ]; do ROOT="$(dirname "$ROOT")"; done
          cd "$ROOT/apps/mobile/ios/App"
          xcodebuild -version
          # What the job received (line endings, the release guard script).
          ls -la .. ../scripts || true
          file ../scripts/* App.xcodeproj/project.pbxproj || true
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          tar -czf "$JOB/Ciclo-simulator.tar.gz" -C build/Build/Products/Debug-iphonesimulator App.app

    - eas/upload_artifact:
        name: Upload the simulator app
        inputs:
          type: application-archive
          path: Ciclo-simulator.tar.gz
